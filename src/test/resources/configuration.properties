# ============================================================
# SauceLabs Mobile Test Automation Framework - Configuration
# ============================================================

# --- Platform Settings ---
# Supported values: android | ios
platform=android

# --- Appium Server ---
appium.server.url=http://127.0.0.1:4723

# --- Android Capabilities ---
# Pixel 7 / Android 14 (API 34) emulator
# Run: adb devices  →  copy the exact device serial (e.g. emulator-5554)
android.deviceName=emulator-5554
android.platformVersion=14.0
android.apiLevel=34

# AVD name as shown in Android Studio's Device Manager
# (usually <DeviceName>_API_<level>, spaces replaced by underscores)
android.avdName=Pixel_7_API_34

android.app=apps/SauceLabsApp.apk
android.appPackage=com.saucelabs.mydemoapp.android
android.appActivity=com.saucelabs.mydemoapp.android.view.activities.SplashActivity
android.automationName=UiAutomator2
android.noReset=false
android.fullReset=false
android.newCommandTimeout=60
android.autoGrantPermissions=true
# Pixel 7 ships with Chrome; let Appium download matching chromedriver automatically
android.chromedriverAutodownload=true

# --- iOS Capabilities (reserved for future use) ---
ios.deviceName=iPhone 15
ios.platformVersion=17.0
ios.app=apps/SauceLabsApp.ipa
ios.bundleId=com.saucelabs.mydemoapp.ios
ios.automationName=XCUITest

# --- Wait Timeouts (seconds) ---
explicit.wait.timeout=20
fluent.wait.timeout=15
fluent.wait.polling=500
implicit.wait.timeout=0

# --- Test Credentials ---
valid.username=bob@example.com
valid.password=10203040
invalid.password=wrongPass99
unregistered.email=notfound@example.com

# --- Reporting ---
screenshot.on.failure=true
